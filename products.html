<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ShopNova products">
    <title>ShopNova | Products</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">

        <a href="index.html" class="logo">ShopNova</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart 🛒 <span id="cart-count">0</span></a>
        </div>

        <button class="menu-btn" onclick="toggleMenu()">☰</button>

    </nav>
</header>

<main>

<section class="products-section">

    <h1>Our Products</h1>
    <p>Find products that match your style.</p>

    <div class="controls">

        <input
            type="text"
            id="search"
            placeholder="Search products..."
            oninput="displayProducts()"
        >

        <select id="category" onchange="displayProducts()">
            <option value="all">All Categories</option>
            <option value="Fashion">Fashion</option>
            <option value="Electronics">Electronics</option>
            <option value="Footwear">Footwear</option>
            <option value="Accessories">Accessories</option>
        </select>

    </div>

    <div id="product-container" class="product-grid"></div>

</section>

</main>

<footer>
    <p>© 2026 ShopNova. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
